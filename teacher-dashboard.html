<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | UPS</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h1 { margin: 0; color: #123c69; }
        .subtitle { color: #64748b; margin-top: 8px; }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .primary-button   { background: #1769ff; color: white; }
        .secondary-button { background: #e2e8f0; color: #1e293b; }
        .danger-button    { background: #dc2626; color: white; }
        .edit-button      { background: #059669; color: white; }
        .report-button    { background: #7c3aed; color: white; }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }
        .card h2 { margin-top: 0; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .form-group { display: flex; flex-direction: column; gap: 7px; }

        label { font-weight: bold; font-size: 14px; }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #1769ff;
        }

        .form-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }
        .toolbar input { max-width: 350px; }

        .table-container { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 750px; }
        th, td { padding: 13px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #eff6ff; color: #123c69; }

        .actions { display: flex; gap: 7px; }
        .actions button { padding: 8px 10px; }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 12px;
            text-transform: capitalize;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 7px;
            display: none;
            white-space: pre-wrap;
        }
        .message.success { display: block; background: #dcfce7; color: #166534; }
        .message.error   { display: block; background: #fee2e2; color: #991b1b; }

        #loadingText { color: #64748b; padding: 15px 0; }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .card { padding: 15px; }
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
            margin: 24px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #ffffff, #f0f6ff);
            border: 1px solid #dbeafe;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1); }
        .stat-card h3 { margin: 0 0 12px; color: #475569; font-size: 14px; font-weight: 600; }
        .stat-card p { margin: 0; color: #1d4ed8; font-size: 32px; font-weight: 700; }

        @media (max-width: 900px) {
            .dashboard-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 520px) {
            .dashboard-stats { grid-template-columns: 1fr; }
            .stat-card { padding: 18px; }
        }

        /* ============= REPORT CARD MODAL ============= */
        .report-modal-backdrop {
            display: none;
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.6);
            z-index: 2000;
            padding: 16px;
            overflow-y: auto;
        }
        .report-modal-backdrop.show { display: block; }
        .report-modal {
            background: #f3f6fb;
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }
        .report-modal-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
            background: #fff;
            padding: 12px 14px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,.05);
        }
        .report-modal-toolbar .left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .report-modal-toolbar label { font-size: 12px; font-weight: bold; color: #475569; margin-right: 4px; }
        .report-modal-toolbar select {
            padding: 7px 10px;
            border-radius: 7px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            background: #fff;
        }
        .report-modal-toolbar .right { display: flex; gap: 8px; flex-wrap: wrap; }
        .report-modal-toolbar button {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 7px;
        }
        .report-close-btn { background: #e2e8f0; color: #1e293b; }
        .report-print-btn { background: #059669; color: #fff; }
        .report-refresh-btn { background: #1769ff; color: #fff; }

        /* ============= REPORT CARD — RESPONSIVE AT ALL SIZES ============= */
        .report-card-v2 {
            background: #fff;
            border: 2px solid #1e3a8a;
            padding: clamp(8px, 1.5vw, 16px);
            font-family: Arial, Helvetica, sans-serif;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 6px;
            overflow: hidden;
            font-size: clamp(9px, 0.85vw + 6px, 12px);
        }

        .rcv2-header {
            display: grid;
            grid-template-columns: clamp(44px, 6vw, 70px) 1fr clamp(80px, 9vw, 110px);
            gap: clamp(4px, 0.8vw, 10px);
            align-items: center;
            border-bottom: 2px solid #1e3a8a;
            padding-bottom: clamp(5px, 0.8vw, 10px);
            margin-bottom: clamp(6px, 1vw, 12px);
        }
        .rcv2-logo {
            width: 100%;
            height: auto;
            max-width: clamp(40px, 5.5vw, 60px);
            aspect-ratio: 1/1;
            object-fit: contain;
        }
        .rcv2-school { text-align: center; min-width: 0; }
        .rcv2-school h1 {
            font-size: clamp(10px, 1.1vw + 6px, 16px);
            color: #1e3a8a;
            letter-spacing: .3px;
            margin: 0 0 2px;
            font-weight: 900;
            word-break: break-word;
            line-height: 1.15;
        }
        .rcv2-motto {
            color: #c2a44c;
            font-size: clamp(6px, 0.4vw + 5px, 9px);
            font-weight: bold;
            letter-spacing: .5px;
            margin-bottom: clamp(2px, 0.5vw, 6px);
        }
        .rcv2-title {
            display: inline-block;
            background: #1e3a8a;
            color: #fff;
            padding: clamp(1px, 0.3vw, 3px) clamp(8px, 1.5vw, 16px);
            font-size: clamp(7px, 0.5vw + 5px, 11px);
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 3px;
        }
        .rcv2-yearterm {
            border: 1.5px solid #1e3a8a;
            border-radius: 6px;
            padding: clamp(3px, 0.5vw, 6px) clamp(3px, 0.6vw, 8px);
            font-size: clamp(7px, 0.5vw + 5px, 10px);
            text-align: center;
            min-width: 0;
        }
        .rcv2-k {
            color: #1e3a8a;
            font-weight: bold;
            letter-spacing: .3px;
            font-size: clamp(5.5px, 0.4vw + 4px, 8px);
        }
        .rcv2-v {
            font-size: clamp(7px, 0.5vw + 5px, 11px);
            font-weight: bold;
            margin: clamp(1px, 0.3vw, 2px) 0 clamp(2px, 0.5vw, 6px);
        }

        /* Body: 2 columns on all sizes (photo + info stack inside) */
        .rcv2-body {
            display: grid;
            grid-template-columns: clamp(60px, 9vw, 110px) 1fr;
            gap: clamp(6px, 1vw, 12px);
            margin-bottom: clamp(6px, 1vw, 12px);
            align-items: start;
        }
        .rcv2-photo {
            border: 1.5px solid #cbd5e1;
            width: 100%;
            aspect-ratio: 5/6;
            object-fit: cover;
            background: #f8fafc;
            border-radius: 4px;
            grid-column: 1;
            grid-row: 1 / span 2;
        }
        .rcv2-photo-empty { background: #f8fafc; }

        .rcv2-info {
            width: 100%;
            font-size: clamp(8px, 0.5vw + 6px, 11px);
            border-collapse: collapse;
            table-layout: fixed;
        }
        .rcv2-body .rcv2-info:nth-of-type(1) {
            grid-column: 2;
            grid-row: 1;
        }
        .rcv2-body .rcv2-info:nth-of-type(2) {
            grid-column: 2;
            grid-row: 2;
        }
        .rcv2-info td {
            padding: clamp(1px, 0.2vw, 3px) clamp(2px, 0.4vw, 4px);
            vertical-align: top;
            border: none;
            word-break: break-word;
            white-space: normal;
            line-height: 1.25;
        }
        .rcv2-info td.k { color: #1e3a8a; font-weight: bold; width: 42%; }
        .rcv2-info td.v { width: 58%; }

        /* Promotion banner */
        .rcv2-promo {
            padding: clamp(5px, 0.8vw, 8px) clamp(8px, 1vw, 12px);
            margin-bottom: clamp(6px, 1vw, 10px);
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            letter-spacing: .5px;
            font-size: clamp(8px, 0.6vw + 5px, 11px);
        }
        .rcv2-promo.promoted { background: #dcfce7; color: #166534; border: 2px solid #16a34a; }
        .rcv2-promo.repeated { background: #fee2e2; color: #991b1b; border: 2px solid #dc2626; }

        /* Subject table */
        .rcv2-subjects {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(7.5px, 0.5vw + 5.5px, 11px);
            margin-bottom: clamp(6px, 1vw, 12px);
            table-layout: fixed;
        }
        .rcv2-subjects th, .rcv2-subjects td {
            border: 1px solid #1e3a8a;
            padding: clamp(2px, 0.4vw, 5px) clamp(3px, 0.5vw, 6px);
            text-align: left;
            word-break: break-word;
            white-space: normal;
            line-height: 1.2;
        }
        .rcv2-subjects thead th {
            background: #1e3a8a;
            color: #fff;
            font-size: clamp(6px, 0.4vw + 4.5px, 9px);
            letter-spacing: .2px;
            text-transform: uppercase;
            text-align: center;
        }
        .rcv2-subjects th:nth-child(1), .rcv2-subjects td:nth-child(1) { width: 26%; }
        .rcv2-subjects th:nth-child(2), .rcv2-subjects td:nth-child(2) { width: 13%; }
        .rcv2-subjects th:nth-child(3), .rcv2-subjects td:nth-child(3) { width: 15%; }
        .rcv2-subjects th:nth-child(4), .rcv2-subjects td:nth-child(4) { width: 13%; }
        .rcv2-subjects th:nth-child(5), .rcv2-subjects td:nth-child(5) { width: 9%; }
        .rcv2-subjects th:nth-child(6), .rcv2-subjects td:nth-child(6) { width: 24%; }
        .rcv2-subjects td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .rcv2-subjects td.center { text-align: center; }
        .rcv2-subjects tfoot td {
            background: #eff6ff;
            font-weight: bold;
            color: #1e3a8a;
        }

        /* Summary */
        .rcv2-summary {
            border: 1.5px solid #1e3a8a;
            border-radius: 6px;
            padding: clamp(6px, 1vw, 10px) clamp(8px, 1.2vw, 12px);
            margin-bottom: clamp(6px, 1vw, 12px);
        }
        .rcv2-summary h3 {
            text-align: center;
            color: #1e3a8a;
            font-size: clamp(8px, 0.6vw + 5px, 12px);
            letter-spacing: .6px;
            margin: 0 0 clamp(4px, 0.6vw, 8px);
        }
        .rcv2-summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(2px, 0.5vw, 4px) clamp(10px, 1.5vw, 18px);
            font-size: clamp(8px, 0.5vw + 6px, 11px);
        }
        .rcv2-summary-grid .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 6px;
            border-bottom: 1px dotted #cbd5e1;
            padding: clamp(1px, 0.3vw, 3px) 0;
        }
        .rcv2-summary-grid .k {
            color: #1e3a8a;
            font-weight: bold;
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .rcv2-summary-grid .v {
            font-weight: bold;
            flex: 0 0 auto;
            text-align: right;
            white-space: nowrap;
        }
        .rcv2-summary-grid .v.green { color: #059669; }
        .rcv2-summary-grid .v.red { color: #dc2626; }

        .rcv2-bottom {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: clamp(6px, 1vw, 12px);
            align-items: end;
        }
        .rcv2-remarks { font-size: clamp(7.5px, 0.5vw + 5.5px, 10px); }
        .rcv2-remarks h4 {
            color: #1e3a8a;
            font-size: clamp(7.5px, 0.5vw + 5.5px, 10px);
            letter-spacing: .4px;
            margin: 0 0 3px;
        }
        .rcv2-remarks p {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: clamp(4px, 0.6vw, 6px);
            min-height: clamp(30px, 4vw, 50px);
            line-height: 1.4;
            margin: 0;
            font-size: clamp(7.5px, 0.5vw + 5.5px, 10px);
        }
        .rcv2-sign { text-align: center; font-size: clamp(7.5px, 0.5vw + 5.5px, 10px); }
        .rcv2-sign img {
            height: clamp(20px, 3vw, 34px);
            display: block;
            margin: 0 auto 3px;
        }
        .rcv2-sign .line {
            border-top: 1px solid #1e3a8a;
            padding-top: 2px;
            color: #1e3a8a;
            font-weight: bold;
            letter-spacing: .3px;
            font-size: clamp(7px, 0.5vw + 5px, 9px);
        }
        .rcv2-sign .name { font-size: clamp(7px, 0.5vw + 5px, 9px); }

        .rcv2-footer {
            text-align: center;
            font-size: clamp(6.5px, 0.4vw + 5px, 9px);
            color: #94a3b8;
            margin-top: clamp(6px, 1vw, 12px);
        }

        /* ============ TABLET (600-900px) ============ */
        @media (max-width: 900px) and (min-width: 601px) {
            .report-modal { padding: 12px; }
            .rcv2-summary-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* ============ MOBILE (<=600px) ============ */
        @media (max-width: 600px) {
            .report-modal-backdrop { padding: 6px; }
            .report-modal { padding: 8px; border-radius: 8px; }

            /* Toolbar stacks */
            .report-modal-toolbar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px;
                gap: 8px;
            }
            .report-modal-toolbar .left,
            .report-modal-toolbar .right {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .report-modal-toolbar .left > span {
                width: 100%;
                font-size: 13px;
                margin-bottom: 4px;
            }
            .report-modal-toolbar select {
                flex: 1 1 80px;
                min-width: 0;
                font-size: 12px;
                padding: 6px 8px;
            }
            .report-modal-toolbar button {
                flex: 1 1 auto;
                font-size: 11px;
                padding: 8px 6px;
            }

            /* Report card */
            .report-card-v2 { padding: 8px; }

            /* Header stacks: logo + school on top, year/term below */
            .rcv2-header {
                grid-template-columns: 40px 1fr;
                grid-template-rows: auto auto;
                gap: 6px;
                text-align: left;
            }
            .rcv2-logo {
                grid-column: 1;
                grid-row: 1;
                max-width: 40px;
                margin: 0;
            }
            .rcv2-school {
                grid-column: 2;
                grid-row: 1;
                text-align: left;
            }
            .rcv2-school h1 { font-size: 12px; }
            .rcv2-title { font-size: 8px; padding: 2px 8px; }
            .rcv2-motto { font-size: 6px; }

            .rcv2-yearterm {
                grid-column: 1 / -1;
                grid-row: 2;
                display: flex;
                justify-content: space-around;
                align-items: center;
                max-width: 100%;
                margin: 4px 0 0;
                padding: 4px 6px;
            }
            .rcv2-yearterm .rcv2-k,
            .rcv2-yearterm .rcv2-v {
                margin: 0;
                display: inline-block;
            }
            .rcv2-yearterm > div { display: flex; gap: 4px; align-items: baseline; }

            /* Body: stack photo above info tables */
            .rcv2-body {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .rcv2-photo {
                grid-column: 1;
                grid-row: 1;
                max-width: 80px;
                margin: 0 auto;
                aspect-ratio: 5/6;
            }
            .rcv2-body .rcv2-info:nth-of-type(1) {
                grid-column: 1;
                grid-row: 2;
            }
            .rcv2-body .rcv2-info:nth-of-type(2) {
                grid-column: 1;
                grid-row: 3;
            }
            .rcv2-info { font-size: 9px; }
            .rcv2-info td.k { width: 40%; }
            .rcv2-info td.v { width: 60%; }

            /* Subject table */
            .rcv2-subjects { font-size: 7px; }
            .rcv2-subjects th, .rcv2-subjects td {
                padding: 3px 2px;
                font-size: 7px;
                line-height: 1.15;
            }
            .rcv2-subjects thead th { font-size: 5.5px; }

            /* Summary stacks 1 column */
            .rcv2-summary-grid { grid-template-columns: 1fr; }
            .rcv2-summary-grid .row { font-size: 8.5px; }

            /* Bottom stacks */
            .rcv2-bottom { grid-template-columns: 1fr; gap: 6px; }
            .rcv2-remarks p { min-height: 28px; padding: 4px; font-size: 8.5px; }
            .rcv2-sign img { height: 18px; }
            .rcv2-sign .line { font-size: 7.5px; }
            .rcv2-sign .name { font-size: 7.5px; }
        }

        /* ============ VERY SMALL PHONES (<=380px) ============ */
        @media (max-width: 380px) {
            .rcv2-school h1 { font-size: 10px; }
            .rcv2-subjects { font-size: 6.5px; }
            .rcv2-subjects th, .rcv2-subjects td { padding: 2px 1.5px; }
            .rcv2-info { font-size: 8px; }
        }

        /* ============ PRINT ============ */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }

            html, body {
                background: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            body * { visibility: hidden !important; }
            #teacherPrintAreaInner,
            #teacherPrintAreaInner * { visibility: visible !important; }

            #teacherPrintAreaInner {
                position: static !important;
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 auto !important;
                padding: 12px !important;
                border: 2px solid #1e3a8a !important;
                background: #fff !important;
                border-radius: 0 !important;
                font-size: 11pt !important;
                page-break-inside: avoid;
            }

            body > *:not(#teacherPrintAreaInner) {
                display: none !important;
            }

            .report-modal-toolbar { display: none !important; }

            /* Force 3-column layout on print */
            #teacherPrintAreaInner .rcv2-header {
                grid-template-columns: 80px 1fr 120px !important;
            }
            #teacherPrintAreaInner .rcv2-body {
                grid-template-columns: 110px 1fr 1fr !important;
            }
            #teacherPrintAreaInner .rcv2-photo {
                grid-column: 1 !important;
                grid-row: 1 / span 2 !important;
                max-width: 100px !important;
                aspect-ratio: 5/6 !important;
            }
            #teacherPrintAreaInner .rcv2-body .rcv2-info:nth-of-type(1) {
                grid-column: 2 !important;
                grid-row: 1 !important;
            }
            #teacherPrintAreaInner .rcv2-body .rcv2-info:nth-of-type(2) {
                grid-column: 3 !important;
                grid-row: 1 !important;
            }
            #teacherPrintAreaInner .rcv2-summary-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
            #teacherPrintAreaInner .rcv2-bottom {
                grid-template-columns: 1.5fr 1fr 1fr !important;
            }
            #teacherPrintAreaInner .rcv2-subjects thead th,
            #teacherPrintAreaInner .rcv2-title,
            #teacherPrintAreaInner .rcv2-subjects tfoot td {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>UPS</h1>
                <p class="subtitle">Teacher Portal</p>
            </div>

            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <a href="dashboard.html"
                   style="text-decoration:none; padding:11px 16px; border-radius:7px;
                          background:#e2e8f0; color:#1e293b; font-weight:bold; font-size:14px;">
                    ← Dashboard
                </a>
                <button type="button" onclick="logout()" class="danger-button">
                    Sign Out
                </button>
            </div>
        </header>

        <div id="messageBox" class="message"></div>

        <section class="card">
            <div class="toolbar">
                <div>
                    <h2>My Students</h2>
                    <p class="subtitle">View and manage students in your assigned classes.</p>
                </div>
                
                <div style="display:flex; gap:10px; align-items:center;">
                    <label for="classFilter" style="margin:0; font-size:13px;">Class:</label>
                    <select id="classFilter" style="width:auto; padding:8px; min-height:36px;">
                        <option value="">All My Classes</option>
                    </select>
                </div>
            </div>

            <p id="loadingText">Loading students...</p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Admission No.</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Class</th>
                            <th>Gender</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- ============= REPORT CARD MODAL ============= -->
    <div class="report-modal-backdrop" id="reportModal">
        <div class="report-modal">
            <div class="report-modal-toolbar">
                <div class="left">
                    <span id="reportStudentName" style="font-weight:bold; color:#123c69;"></span>
                    <label>Year</label>
                    <select id="reportYearSelect"></select>
                    <label>Term</label>
                    <select id="reportTermSelect">
                        <option value="First Term">First Term</option>
                        <option value="Second Term">Second Term</option>
                        <option value="Third Term">Third Term</option>
                    </select>
                </div>
                <div class="right">
                    <button type="button" class="report-refresh-btn" onclick="refreshTeacherReport()">↻ Refresh</button>
                    <button type="button" class="report-print-btn" onclick="printTeacherReport()">🖨️ Print / Save PDF</button>
                    <button type="button" class="report-close-btn" onclick="closeTeacherReport()">✕ Close</button>
                </div>
            </div>
            <div id="teacherReportContent" style="text-align:center; padding:40px; color:#64748b;">
                Loading report…
            </div>
        </div>
    </div>

    <script>
        "use strict";

        const SUPABASE_URL = "https://wziomowgprtudxfuikxk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_dDOOWELGkwLJOFWqcZUiXw_qJLzno_b";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true,
                    storage: window.sessionStorage
                }
            }
        );

        const studentTableBody = document.getElementById("studentTableBody");
        const loadingText = document.getElementById("loadingText");
        const messageBox = document.getElementById("messageBox");
        const classFilter = document.getElementById("classFilter");

        let students = [];
        let teacherClasses = [];
        let currentReportStudentId = null;
        let allAcademicYears = [];

        function showMessage(message, type = "success") {
            messageBox.textContent = message;
            messageBox.className = "message " + type;

            window.scrollTo({ top: 0, behavior: "smooth" });

            setTimeout(() => {
                messageBox.className = "message";
                messageBox.textContent = "";
            }, 6000);
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }
        window.logout = logout;

        async function verifyTeacher() {
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

            if (sessionError) throw sessionError;

            if (!session) {
                showMessage("Please sign in with your teacher account.", "error");
                setTimeout(() => { window.location.href = "index.html"; }, 1500);
                return false;
            }

            const { data: profile, error } = await supabaseClient
                .from("user_profiles")
                .select("role, staff_id")
                .eq("user_id", session.user.id)
                .maybeSingle();

            if (error) throw error;

            if (!profile || String(profile.role).toLowerCase() !== "teacher") {
                showMessage("Teacher access is required.", "error");
                loadingText.textContent = "Teacher access required.";
                return false;
            }

            if (!profile.staff_id) {
                showMessage("Your account is not linked to a staff record. Contact admin.", "error");
                loadingText.textContent = "Staff record missing.";
                return false;
            }

            return profile.staff_id;
        }

        async function loadTeacherClasses(staffId) {
            // Get class assignments
            const { data: assignments, error: assignErr } = await supabaseClient
                .from("teacher_class_assignments")
                .select("class_id, classes(class_name)")
                .eq("staff_id", staffId);

            if (assignErr) throw assignErr;

            teacherClasses = (assignments || []).map(a => ({
                class_id: a.class_id,
                class_name: a.classes?.class_name || "Unknown"
            }));

            classFilter.innerHTML = '<option value="">All My Classes</option>';
            teacherClasses.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c.class_id;
                opt.textContent = c.class_name;
                classFilter.appendChild(opt);
            });
        }

        async function loadStudents(staffId) {
            loadingText.textContent = "Loading students...";
            studentTableBody.innerHTML = "";

            const selectedClass = classFilter.value;

            try {
              let query = supabaseClient
    .from("students")
    .select("student_id, admission_number, first_name, last_name, class_id, gender, status, avatar_url, father_name, mother_name, date_of_birth, enrollment_date, roll_no, promotion_status, promoted_to_class, promotion_year")
    .eq("status", "active")
    .order("first_name");

                // If teacher has classes, filter by them
                if (teacherClasses.length > 0) {
                    const classIds = teacherClasses.map(c => c.class_id);
                    query = query.in("class_id", classIds);
                } else {
                    // If no classes assigned, show nothing
                    loadingText.textContent = "You have no classes assigned yet.";
                    return;
                }

                if (selectedClass) {
                    query = query.eq("class_id", selectedClass);
                }

                const { data, error } = await query;
                if (error) throw error;

                students = data || [];

                if (students.length === 0) {
                    loadingText.textContent = "No active students found.";
                    return;
                }

                const classMap = {};
                teacherClasses.forEach(c => { classMap[c.class_id] = c.class_name; });

                students.forEach(student => {
                    const row = document.createElement("tr");

                    const admCell = document.createElement("td");
                    admCell.textContent = student.admission_number || "—";
                    row.appendChild(admCell);

                    const firstCell = document.createElement("td");
                    firstCell.textContent = student.first_name || "";
                    row.appendChild(firstCell);

                    const lastCell = document.createElement("td");
                    lastCell.textContent = student.last_name || "";
                    row.appendChild(lastCell);

                    const classCell = document.createElement("td");
                    classCell.textContent = classMap[student.class_id] || "—";
                    row.appendChild(classCell);

                    const genderCell = document.createElement("td");
                    genderCell.textContent = student.gender || "—";
                    row.appendChild(genderCell);

                    const statusCell = document.createElement("td");
                    const badge = document.createElement("span");
                    badge.className = "status";
                    badge.textContent = student.status;
                    statusCell.appendChild(badge);
                    row.appendChild(statusCell);

                    const actionsCell = document.createElement("td");
                    const actions = document.createElement("div");
                    actions.className = "actions";

                    const reportButton = document.createElement("button");
                    reportButton.type = "button";
                    reportButton.className = "report-button";
                    reportButton.textContent = "Report";
                    reportButton.addEventListener("click", () => { openTeacherReport(student.student_id); });

                    actions.appendChild(reportButton);
                    actionsCell.appendChild(actions);
                    row.appendChild(actionsCell);

                    studentTableBody.appendChild(row);
                });

                loadingText.textContent = students.length + " student(s) found.";

            } catch (error) {
                console.error("Student loading error:", error);
                loadingText.textContent = "Could not load students.";
                showMessage("Student loading failed: " + error.message, "error");
            }
        }

        async function loadAcademicYearsForReport() {
            const { data, error } = await supabaseClient
                .from("academic_years")
                .select("academic_year, is_current, current_term")
                .order("academic_year", { ascending: false });

            if (error) {
                console.error("Academic years load error:", error);
                return;
            }

            allAcademicYears = data || [];

            const yearSel = document.getElementById("reportYearSelect");
            yearSel.innerHTML = "";
            allAcademicYears.forEach(y => {
                const opt = document.createElement("option");
                opt.value = y.academic_year;
                opt.textContent = y.academic_year + (y.is_current ? " (current)" : "");
                yearSel.appendChild(opt);
            });

            const current = allAcademicYears.find(y => y.is_current);
            if (current) yearSel.value = current.academic_year;
        }

        async function openTeacherReport(studentId) {
            currentReportStudentId = studentId;
            const student = students.find(s => String(s.student_id) === String(studentId));
            if (!student) return;

            document.getElementById("reportStudentName").textContent =
                student.first_name + " " + student.last_name + " — " + (student.admission_number || "");

            const current = allAcademicYears.find(y => y.is_current);
            if (current) {
                document.getElementById("reportYearSelect").value = current.academic_year;
                document.getElementById("reportTermSelect").value = current.current_term || "First Term";
            }

            document.getElementById("reportModal").classList.add("show");
            await renderTeacherReport();
        }

        function closeTeacherReport() {
            document.getElementById("reportModal").classList.remove("show");
            currentReportStudentId = null;
        }
        window.closeTeacherReport = closeTeacherReport;

        async function refreshTeacherReport() {
            if (currentReportStudentId) await renderTeacherReport();
        }
        window.refreshTeacherReport = refreshTeacherReport;

        function printTeacherReport() {
            const inner = document.getElementById("teacherPrintAreaInner");
            if (!inner) return;
            const printArea = document.createElement("div");
            printArea.id = "teacherPrintAreaInner";
            printArea.innerHTML = inner.outerHTML;
            printArea.id = "teacherPrintAreaInner";
            document.body.appendChild(printArea);
            window.print();
            setTimeout(() => { printArea.remove(); }, 100);
        }
        window.printTeacherReport = printTeacherReport;

        async function renderTeacherReport() {
            const container = document.getElementById("teacherReportContent");
            const studentId = currentReportStudentId;
            const year = document.getElementById("reportYearSelect").value;
            const term = document.getElementById("reportTermSelect").value;

            if (!studentId || !year || !term) return;

            container.innerHTML = '<p style="padding:30px; color:#64748b;">Loading report…</p>';

            const student = students.find(s => String(s.student_id) === String(studentId));
            if (!student) {
                container.innerHTML = '<p style="color:#dc2626;">Student not found.</p>';
                return;
            }

            const { data: settings } = await supabaseClient
                .from("school_settings")
                .select("school_name, principal_name, principal_signature_url, logo_url, school_address, school_phone")
                .eq("id", 1)
                .maybeSingle();

            const schoolName = settings?.school_name || "SCHOOL NAME";
            const principalName = settings?.principal_name || "Principal";
            const principalSigUrl = settings?.principal_signature_url || null;
            const logoUrl = settings?.logo_url || null;

            const { data: results, error } = await supabaseClient
                .from("exam_results")
                .select("subject, class_score, exam_score, score, remarks")
                .eq("student_id", studentId)
                .eq("academic_year", year)
                .eq("term", term)
                .order("subject");

            if (error) {
                container.innerHTML = '<p style="color:#dc2626;">Error: ' + esc(error.message) + '</p>';
                return;
            }

            if (!results || !results.length) {
                container.innerHTML = '<p style="padding:30px; color:#64748b;">No results recorded for ' + esc(term) + ' ' + esc(year) + '.</p>';
                return;
            }

            let studentPhotoUrl = null;
            if (student.avatar_url) {
                const { data: signed } = await supabaseClient
                    .storage
                    .from("student-avatars")
                    .createSignedUrl(student.avatar_url, 3600);
                if (signed) studentPhotoUrl = signed.signedUrl;
            }

            const totalMarks = results.length * 100;
            const marksObtained = results.reduce((sum, r) => sum + Number(r.score || 0), 0);
            const percentage = totalMarks > 0 ? ((marksObtained / totalMarks) * 100).toFixed(2) : "0.00";
            const overallGrade = gradeFor(Number(percentage));
            const resultStatus = Number(percentage) >= 50 ? "PASS" : "FAIL";

            const subjectRows = results.map(r => `
                <tr>
                    <td>${esc(r.subject)}</td>
                    <td class="num">100</td>
                    <td class="num">${Number(r.score || 0).toFixed(2)}</td>
                    <td class="num">${Number(r.score || 0).toFixed(2)}%</td>
                    <td class="center">${gradeFor(r.score)}</td>
                    <td>${esc(r.remarks || "")}</td>
                </tr>
            `).join("");

            let className = "—";
            if (student.class_id) {
                const { data: klass } = await supabaseClient
                    .from("classes")
                    .select("class_name")
                    .eq("class_id", student.class_id)
                    .maybeSingle();
                if (klass) className = klass.class_name;
            }

            const promotionYearMatch = student.promotion_year === year;
            const showPromotionBanner =
                term === "Third Term" &&
                student.promotion_status &&
                promotionYearMatch;

            const promotionBanner = showPromotionBanner
                ? `<div class="rcv2-promo ${student.promotion_status === "promoted" ? "promoted" : "repeated"}">
                     ${student.promotion_status === "promoted"
                       ? "✔ PROMOTED TO " + esc((student.promoted_to_class || "").toUpperCase())
                       : "✖ REPEATED — STAYS IN " + esc((student.promoted_to_class || "").toUpperCase())}
                   </div>`
                : "";

            container.innerHTML = `
                <div id="teacherPrintAreaInner" class="report-card-v2">

                    <div class="rcv2-header">
                        ${logoUrl ? `<img class="rcv2-logo" src="${esc(logoUrl)}" alt="Logo">` : `<div class="rcv2-logo"></div>`}
                        <div class="rcv2-school">
                            <h1>${esc(schoolName)}</h1>
                            <div style="font-size: 10px; color: #475569; font-weight: bold; margin-bottom: 2px;">
                                ${settings?.school_address ? esc(settings.school_address) : ""} 
                                ${settings?.school_phone ? " | " + esc(settings.school_phone) : ""}
                            </div>
                            <div class="rcv2-motto">EXCELLENCE | DISCIPLINE | SUCCESS</div>
                            <div class="rcv2-title">RESULT CARD</div>
                        </div>
                        <div class="rcv2-yearterm">
                            <div><span class="rcv2-k">YEAR</span> <span class="rcv2-v">${esc(year)}</span></div>
                            <div><span class="rcv2-k">TERM</span> <span class="rcv2-v">${esc(term)}</span></div>
                        </div>
                    </div>

                    <div class="rcv2-body">
                        ${studentPhotoUrl
                            ? `<img class="rcv2-photo" src="${esc(studentPhotoUrl)}" alt="Student photo">`
                            : `<div class="rcv2-photo rcv2-photo-empty"></div>`}

                        <table class="rcv2-info">
                            <tr><td class="k">STUDENT NAME</td><td class="v">: ${esc(student.first_name + " " + student.last_name)}</td></tr>
                            <tr><td class="k">FATHER'S NAME</td><td class="v">: ${esc(student.father_name || "—")}</td></tr>
                            <tr><td class="k">MOTHER'S NAME</td><td class="v">: ${esc(student.mother_name || "—")}</td></tr>
                            <tr><td class="k">CLASS</td><td class="v">: ${esc(className)}</td></tr>
                            <tr><td class="k">ADMISSION NO.</td><td class="v">: ${esc(student.admission_number || "—")}</td></tr>
                        </table>

                        <table class="rcv2-info">
                            <tr><td class="k">DATE OF BIRTH</td><td class="v">: ${esc(student.date_of_birth || "—")}</td></tr>
                            <tr><td class="k">DATE OF ADMISSION</td><td class="v">: ${esc(student.enrollment_date || "—")}</td></tr>
                            <tr><td class="k">ROLL NO.</td><td class="v">: ${esc(student.roll_no || "—")}</td></tr>
                            <tr><td class="k">GENDER</td><td class="v">: ${esc(student.gender || "—")}</td></tr>
                        </table>
                    </div>

                    ${promotionBanner}

                    <table class="rcv2-subjects">
                        <thead>
                            <tr>
                                <th style="text-align:left;">SUBJECT</th>
                                <th>MAX</th>
                                <th>OBTAINED</th>
                                <th>PERCENT</th>
                                <th>GRADE</th>
                                <th style="text-align:left;">REMARKS</th>
                            </tr>
                        </thead>
                        <tbody>${subjectRows}</tbody>
                        <tfoot>
                            <tr>
                                <td>TOTAL</td>
                                <td class="num">${totalMarks}</td>
                                <td class="num">${marksObtained.toFixed(2)}</td>
                                <td class="num">${percentage}%</td>
                                <td class="center">${overallGrade}</td>
                                <td>${Number(percentage) >= 50 ? "Excellent" : "Needs Improvement"}</td>
                            </tr>
                        </tfoot>
                    </table>

                    <div class="rcv2-summary">
                        <h3>RESULT SUMMARY</h3>
                        <div class="rcv2-summary-grid">
                            <div class="row"><span class="k">TOTAL MARKS</span><span class="v">: ${totalMarks}</span></div>
                            <div class="row"><span class="k">MARKS OBTAINED</span><span class="v">: ${marksObtained.toFixed(2)}</span></div>
                            <div class="row"><span class="k">PERCENTAGE</span><span class="v">: ${percentage}%</span></div>
                            <div class="row"><span class="k">OVERALL GRADE</span><span class="v">: ${overallGrade}</span></div>
                            <div class="row"><span class="k">RESULT</span><span class="v ${resultStatus === "PASS" ? "green" : "red"}">: ${resultStatus}</span></div>
                        </div>
                    </div>

                    <div class="rcv2-bottom">
                        <div class="rcv2-remarks">
                            <h4>CLASS TEACHER'S REMARKS</h4>
                            <p>${Number(percentage) >= 50
                                ? "Well done! Keep up the excellent work."
                                : "Needs improvement. Please work harder next term."}</p>
                        </div>

                        <div class="rcv2-sign">
                            ${principalSigUrl ? `<img src="${esc(principalSigUrl)}" alt="Signature">` : `<div style="height:34px;"></div>`}
                            <div class="line">PRINCIPAL</div>
                            <div class="name">${esc(principalName)}</div>
                        </div>

                        <div class="rcv2-sign">
                            <div style="height:34px;"></div>
                            <div class="line">CLASS TEACHER</div>
                            <div class="name">&nbsp;</div>
                        </div>
                    </div>

                    <div class="rcv2-footer">
                        Generated ${new Date().toLocaleDateString("en-GB")} — ${esc(schoolName)}
                    </div>
                </div>
            `;
        }

        function gradeFor(s) {
            const n = Number(s || 0);
            if (n >= 80) return "A";
            if (n >= 70) return "B";
            if (n >= 60) return "C";
            if (n >= 50) return "D";
            return "F";
        }

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c =>
                ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
        }

        async function init() {
            try {
                const staffId = await verifyTeacher();
                if (!staffId) return;

                await loadTeacherClasses(staffId);
                await loadAcademicYearsForReport();
                await loadStudents(staffId);

                classFilter.addEventListener("change", () => loadStudents(staffId));

                document.getElementById("reportYearSelect").addEventListener("change", refreshTeacherReport);
                document.getElementById("reportTermSelect").addEventListener("change", refreshTeacherReport);

                document.getElementById("reportModal").addEventListener("click", (e) => {
                    if (e.target.id === "reportModal") closeTeacherReport();
                });
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") closeTeacherReport();
                });

            } catch (err) {
                console.error("Initialization error:", err);
                showMessage("Error loading dashboard: " + err.message, "error");
            }
        }

        init();
    </script>
</body>
</html>
