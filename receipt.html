<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt Management | UPS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f3f6fb; color: #1e293b;
  }
  .container { max-width: 1200px; margin: 0 auto; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 15px; flex-wrap: wrap; margin-bottom: 25px;
  }
  h1 { margin: 0; color: #123c69; font-size: 26px; }
  .subtitle { color: #64748b; margin-top: 6px; font-size: 14px; }

  .nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-buttons a {
    text-decoration: none; padding: 10px 14px; border-radius: 7px;
    font-size: 13px; font-weight: bold; color: #fff; background: #1769ff;
  }
  .nav-buttons a.secondary { background: #e2e8f0; color: #1e293b; }

  .card {
    background: #fff; padding: 22px; border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05); margin-bottom: 22px;
  }
  .card h2 { margin: 0 0 16px; font-size: 17px; color: #123c69; }

  .filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-weight: bold; font-size: 13px; color: #475569; }
  input, select {
    padding: 10px; border: 1px solid #cbd5e1; border-radius: 7px;
    font-size: 14px; background: white;
  }
  input:focus, select:focus {
    outline: 2px solid #93c5fd; border-color: #1769ff;
  }

  button {
    border: none; border-radius: 7px; padding: 10px 16px;
    cursor: pointer; font-size: 14px; font-weight: bold;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .primary-button { background: #1769ff; color: white; }
  .secondary-button { background: #e2e8f0; color: #1e293b; }
  .print-button { background: #059669; color: white; padding: 7px 12px; font-size: 12px; }

  .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 11px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  th { background: #eff6ff; color: #123c69; font-size: 12px; text-transform: uppercase; }
  tr:hover td { background: #f8fafc; }

  .money { font-weight: bold; color: #059669; }

  .empty { text-align: center; padding: 30px; color: #94a3b8; }

  .message {
    padding: 12px; border-radius: 7px; margin-bottom: 15px;
    display: none; white-space: pre-wrap;
  }
  .message.success { display:block; background:#dcfce7; color:#166534; }
  .message.error   { display:block; background:#fee2e2; color:#991b1b; }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 1000; padding: 20px; overflow-y: auto;
  }
  .modal-backdrop.show { display: flex; align-items: flex-start; justify-content: center; }
  .modal {
    background: white; max-width: 700px; width: 100%;
    border-radius: 12px; padding: 30px; position: relative; margin: auto;
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px;
    background: #e2e8f0; color: #1e293b; padding: 6px 10px;
    font-size: 12px; border-radius: 6px;
  }

  .receipt {
    font-family: "Courier New", monospace;
    max-width: 620px; margin: 0 auto;
  }
  .receipt-header { text-align: center; border-bottom: 2px dashed #1e293b; padding-bottom: 14px; margin-bottom: 20px; }
  .receipt-header h2 { margin: 0 0 4px; color: #123c69; font-size: 22px; letter-spacing: 2px; }
  .receipt-header p  { margin: 2px 0; color: #475569; font-size: 13px; }
  .receipt-title {
    text-align: center; font-weight: bold; font-size: 16px;
    letter-spacing: 3px; margin: 18px 0; color: #123c69;
  }
  .receipt-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dotted #cbd5e1; font-size: 14px; }
  .receipt-row .label { color: #64748b; }
  .receipt-row .value { font-weight: bold; color: #1e293b; text-align: right; }
  .receipt-total {
    display: flex; justify-content: space-between;
    padding: 14px 0; margin-top: 10px; border-top: 2px solid #1e293b;
    border-bottom: 2px solid #1e293b;
    font-size: 18px; font-weight: bold; color: #123c69;
  }
  .receipt-footer { text-align: center; margin-top: 26px; font-size: 12px; color: #64748b; line-height: 1.7; }
  .receipt-stamp {
    text-align: center; margin-top: 20px; color: #059669;
    font-weight: bold; letter-spacing: 4px; font-size: 15px;
    border: 2px solid #059669; display: inline-block;
    padding: 4px 14px; border-radius: 6px; transform: rotate(-3deg);
  }
  .receipt-actions { text-align: center; margin-top: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  @media print {
    @page { size: A4; margin: 12mm; }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
      height: auto !important;
      overflow: visible !important;
    }

    body > *:not(#receiptModal) {
      display: none !important;
    }

    #receiptModal {
      display: block !important;
      position: static !important;
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: visible !important;
      inset: auto !important;
    }

    #receiptModal .modal {
      display: block !important;
      position: static !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
    }

    .modal-close,
    .receipt-actions {
      display: none !important;
    }

    #receiptPrintArea {
      display: block !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .receipt, .receipt * {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
  }

  @media (max-width: 700px) {
    body { padding: 12px; }
    .card { padding: 16px; }
    th, td { padding: 8px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div>
      <h1>UPS</h1>
      <p class="subtitle">Receipt Management</p>
    </div>
    <div class="nav-buttons">
      <a href="financial-dashboard.html" class="secondary">📊 Dashboard</a>
      <a href="student-management.html" class="secondary">🎓 Students</a>
      <a href="fee-payments.html">💰 Fee Payments</a>
    </div>
  </header>

  <div id="messageBox" class="message"></div>

  <section class="card">
    <h2>Search Receipts</h2>
    <div class="filters">
      <div class="form-group">
        <label for="searchInput">Student / Admission No</label>
        <input type="search" id="searchInput" placeholder="e.g. Ama or 68909">
      </div>
      <div class="form-group">
        <label for="methodFilter">Payment Method</label>
        <select id="methodFilter">
          <option value="">All methods</option>
        </select>
      </div>
      <div class="form-group">
        <label for="dateFrom">From Date</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="form-group">
        <label for="dateTo">To Date</label>
        <input type="date" id="dateTo">
      </div>
    </div>
    <div class="toolbar-actions">
      <button type="button" id="clearFilters" class="secondary-button">Clear Filters</button>
      <button type="button" id="refreshBtn" class="primary-button">Refresh</button>
    </div>
  </section>

  <section class="card">
    <h2>Receipts</h2>
    <p id="loadingText" class="subtitle" style="margin-top:-8px;">Loading receipts…</p>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Receipt #</th>
            <th>Date</th>
            <th>Adm. No</th>
            <th>Student</th>
            <th>Class</th>
            <th>Fee</th>
            <th>Method</th>
            <th>Amount</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="receiptsBody">
          <tr><td colspan="9" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</div>

<div class="modal-backdrop" id="receiptModal">
  <div class="modal">
    <button type="button" class="modal-close" onclick="closeReceipt()">✕ Close</button>
    <div id="receiptPrintArea">
      <div class="receipt" id="receiptContent"></div>
    </div>
    <div class="receipt-actions">
      <button type="button" class="print-button" onclick="printReceipt()">🖨️ Print / Save as PDF</button>
      <button type="button" class="secondary-button" onclick="closeReceipt()">Close</button>
    </div>
  </div>
</div>

<script>
"use strict";

const SUPABASE_URL      = "https://wziomowgprtudxfuikxk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dDOOWELGkwLJOFWqcZUiXw_qJLzno_b";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storage: window.sessionStorage
  }
});

const messageBox     = document.getElementById("messageBox");
const receiptsBody   = document.getElementById("receiptsBody");
const loadingText    = document.getElementById("loadingText");
const searchInput    = document.getElementById("searchInput");
const methodFilter   = document.getElementById("methodFilter");
const dateFrom       = document.getElementById("dateFrom");
const dateTo         = document.getElementById("dateTo");

let receipts = [];
let currentReceipt = null;

function showMessage(msg, type = "success") {
  messageBox.textContent = msg;
  messageBox.className = "message " + type;
  setTimeout(() => { messageBox.className = "message"; messageBox.textContent = ""; }, 5000);
}
function money(n) { return Number(n || 0).toFixed(2); }
function fmtDate(d) {
  if (!d) return "—";
  const date = new Date(d);
  return date.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
function fmtDateTime(d) {
  if (!d) return "—";
  const date = new Date(d);
  return date.toLocaleString("en-GB", {
    day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

async function loadReceipts() {
  loadingText.textContent = "Loading receipts…";

  const { data: payments, error: pErr } = await supabaseClient
    .from("fee_payments")
    .select(`
      payment_id,
      payment_date,
      amount_paid,
      payment_method,
      transaction_reference,
      notes,
      student_id,
      fee_id
    `)
    .order("payment_date", { ascending: false });

  if (pErr) {
    console.error("payments error:", pErr);
    receiptsBody.innerHTML = `<tr><td colspan="9" class="empty">Failed to load receipts.</td></tr>`;
    loadingText.textContent = "Load failed.";
    showMessage("Could not load receipts: " + pErr.message, "error");
    return;
  }

  const { data: students } = await supabaseClient
    .from("students")
    .select("student_id, admission_number, first_name, last_name, class_id");

  const { data: classes } = await supabaseClient
    .from("classes")
    .select("class_id, class_name");

  const { data: fees } = await supabaseClient
    .from("student_fees")
    .select("fee_id, fee_description, academic_year, term, amount_due");

  const studentMap = {};
  (students || []).forEach(s => { studentMap[s.student_id] = s; });

  const classMap = {};
  (classes || []).forEach(c => { classMap[c.class_id] = c; });

  const feeMap = {};
  (fees || []).forEach(f => { feeMap[f.fee_id] = f; });

  receipts = (payments || []).map(p => {
    const stu = studentMap[p.student_id] || {};
    const cls = classMap[stu.class_id] || {};
    const fee = feeMap[p.fee_id] || {};

    return {
      ...p,
      students: {
        admission_number: stu.admission_number,
        first_name: stu.first_name,
        last_name: stu.last_name,
        classes: { class_name: cls.class_name }
      },
      student_fees: fee
    };
  });

  populateMethodFilter();
  renderReceipts();
}
function populateMethodFilter() {
  const methods = [...new Set(receipts.map(r => r.payment_method).filter(Boolean))].sort();
  methodFilter.innerHTML = '<option value="">All methods</option>' +
    methods.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
}

function renderReceipts() {
  const q        = searchInput.value.trim().toLowerCase();
  const method   = methodFilter.value;
  const fromDate = dateFrom.value ? new Date(dateFrom.value) : null;
  const toDate   = dateTo.value   ? new Date(dateTo.value + "T23:59:59") : null;

  const filtered = receipts.filter(r => {
    const stu = r.students || {};
    const fullName = ((stu.first_name || "") + " " + (stu.last_name || "")).toLowerCase();
    const adm      = String(stu.admission_number || "").toLowerCase();

    const matchQ = !q || fullName.includes(q) || adm.includes(q);
    const matchM = !method || r.payment_method === method;

    const pd = r.payment_date ? new Date(r.payment_date) : null;
    const matchFrom = !fromDate || (pd && pd >= fromDate);
    const matchTo   = !toDate   || (pd && pd <= toDate);

    return matchQ && matchM && matchFrom && matchTo;
  });

  loadingText.textContent = filtered.length + " receipt(s) found.";

  if (filtered.length === 0) {
    receiptsBody.innerHTML = `<tr><td colspan="9" class="empty">No receipts match your filters.</td></tr>`;
    return;
  }

  receiptsBody.innerHTML = filtered.map(r => {
    const stu = r.students || {};
    const cls = stu.classes?.class_name || "—";
    const fee = r.student_fees?.fee_description || "—";
    const recNo = "RCP-" + String(r.payment_id).padStart(5, "0");

    return `
      <tr>
        <td>${esc(recNo)}</td>
        <td>${fmtDate(r.payment_date)}</td>
        <td>${esc(stu.admission_number || "—")}</td>
        <td>${esc((stu.first_name || "") + " " + (stu.last_name || ""))}</td>
        <td>${esc(cls)}</td>
        <td>${esc(fee)}</td>
        <td>${esc(r.payment_method || "—")}</td>
        <td class="money">${money(r.amount_paid)}</td>
        <td>
          <button type="button" class="print-button" onclick="viewReceipt(${r.payment_id})">
            🧾 View
          </button>
        </td>
      </tr>
    `;
  }).join("");
}

function viewReceipt(paymentId) {
  const r = receipts.find(x => x.payment_id === paymentId);
  if (!r) return;

  currentReceipt = r;
  const stu = r.students || {};
  const fee = r.student_fees || {};
  const recNo = "RCP-" + String(r.payment_id).padStart(5, "0");

  document.getElementById("receiptContent").innerHTML = `
    <div class="receipt-header">
      <h2>UPS ACADEMY</h2>
      <p>P.O. Box 123, Accra, Ghana</p>
      <p>Tel: +233 XX XXX XXXX  •  info@UPS.edu</p>
    </div>

    <div class="receipt-title">OFFICIAL RECEIPT</div>

    <div class="receipt-row"><span class="label">Receipt No:</span><span class="value">${esc(recNo)}</span></div>
    <div class="receipt-row"><span class="label">Date:</span><span class="value">${fmtDateTime(r.payment_date)}</span></div>
    <div class="receipt-row"><span class="label">Admission No:</span><span class="value">${esc(stu.admission_number || "—")}</span></div>
    <div class="receipt-row"><span class="label">Student:</span><span class="value">${esc((stu.first_name || "") + " " + (stu.last_name || ""))}</span></div>
    <div class="receipt-row"><span class="label">Class:</span><span class="value">${esc(stu.classes?.class_name || "—")}</span></div>

    <div style="height:14px;"></div>

    <div class="receipt-row"><span class="label">Fee Type:</span><span class="value">${esc(fee.fee_description || "—")}</span></div>
    <div class="receipt-row"><span class="label">Academic Year:</span><span class="value">${esc(fee.academic_year || "—")}</span></div>
    <div class="receipt-row"><span class="label">Term:</span><span class="value">${esc(fee.term || "—")}</span></div>
    <div class="receipt-row"><span class="label">Amount Due:</span><span class="value">${money(fee.amount_due)}</span></div>

    <div class="receipt-total">
      <span>AMOUNT PAID</span>
      <span>GHS ${money(r.amount_paid)}</span>
    </div>

    <div class="receipt-row"><span class="label">Payment Method:</span><span class="value">${esc(r.payment_method || "—")}</span></div>
    <div class="receipt-row"><span class="label">Reference:</span><span class="value">${esc(r.transaction_reference || "—")}</span></div>
    ${r.notes ? `<div class="receipt-row"><span class="label">Notes:</span><span class="value">${esc(r.notes)}</span></div>` : ""}

    <div style="text-align:center; margin-top:22px;">
      <span class="receipt-stamp">✓ PAID</span>
    </div>

    <div class="receipt-footer">
      Thank you for your payment.<br>
      This is a computer-generated receipt and does not require a signature.<br>
      Keep this receipt for your records.
    </div>
  `;

  document.getElementById("receiptModal").classList.add("show");
}

function closeReceipt() {
  document.getElementById("receiptModal").classList.remove("show");
  currentReceipt = null;
}

function printReceipt() {
  window.print();
}

searchInput.addEventListener("input", renderReceipts);
methodFilter.addEventListener("change", renderReceipts);
dateFrom.addEventListener("change", renderReceipts);
dateTo.addEventListener("change", renderReceipts);

document.getElementById("clearFilters").addEventListener("click", () => {
  searchInput.value = "";
  methodFilter.value = "";
  dateFrom.value = "";
  dateTo.value = "";
  renderReceipts();
});

document.getElementById("refreshBtn").addEventListener("click", loadReceipts);

document.getElementById("receiptModal").addEventListener("click", e => {
  if (e.target.id === "receiptModal") closeReceipt();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeReceipt();
});

window.viewReceipt = viewReceipt;
window.closeReceipt = closeReceipt;
window.printReceipt = printReceipt;

loadReceipts();
</script>
</body>
</html>
